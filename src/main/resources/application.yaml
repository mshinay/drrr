spring:
  application:
    name: drrr
  data:
    redis:
      host: localhost
      port: 6379


drrr:
  user:
    reconnect-timeout: 5m
  lobby:
    active-window: 5m
  room:
    empty-expiry: 24h
    max-members-min: 1
    max-members-max: 20
  cleanup:
    reconnect-scan-fixed-delay-ms: 60000
    empty-room-scan-fixed-delay-ms: 60000
  websocket:
    endpoint: /ws/rooms
